<p-dialog [(visible)]="visible" [modal]="true" (onHide)="volverLista()" [style]="{ width: '28rem' }">
  <ng-template #header>
    <div class="flex items-center gap-2">
      <i class="pi pi-id-card text-xl text-primary"></i>
      <span class="font-semibold text-lg">Registrar Moneda</span>
    </div>
  </ng-template>

  <div class="flex flex-col gap-4 mt-2">

    <!-- DESCRIPCIÓN -->
    <div class="flex flex-col gap-1">
      <label class="font-medium">Descripción</label>
      <input pInputText
             [(ngModel)]="moneda.descripcion"
             name="descripcion"
             placeholder="Ej: SOL, DOLAR, .." />
    </div>

    <!-- CÓDIGO SUNAT -->
    <div class="flex flex-col gap-1">
      <label class="font-medium">Símbolo</label>
      <input pInputText
             [(ngModel)]="moneda.simbolo"
             name="simbolo"
             placeholder="Ej: s/"
             maxlength="2" />
    </div>

    <div class="flex flex-col gap-1">
      <label class="font-medium">Registrar como predeterminada</label>
      <p-toggleswitch [(ngModel)]="moneda.esPrincipal" [trueValue]="1" [falseValue]="0" />
    </div>



  </div>

  <ng-template #footer>
    <div class="flex justify-end gap-2">

      <p-button label="Cancelar" icon="pi pi-times" severity="secondary"
        [text]="true" (click)="volverLista()">
      </p-button>

      <p-button label="Guardar" icon="pi pi-check" severity="success"
        (click)="guardar()">
      </p-button>

    </div>
  </ng-template>

</p-dialog>

 <p-toast />
