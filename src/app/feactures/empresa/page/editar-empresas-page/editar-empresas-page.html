<p-dialog [(visible)]="visibleEditar" [modal]="true" (onHide)="volverLista()" [style]="{ width: '50rem' }">
  <ng-template #header>
    <div class="flex items-center gap-2">
      <i class="pi pi-id-card text-xl text-primary"></i>
      <span class="font-semibold text-lg">Editar empresa</span>
    </div>
  </ng-template>

  <div class="grid grid-cols-5 gap-8">
    <div class="col-span-3 flex flex-col gap-4 mt-2">
      <h3 class="text-gray-400">Datos principales</h3>
      <div class="flex flex-col gap-1">
        <label class="font-medium" for="rucEmpresa">Ruc empresa</label>
        <input pInputText id="rucEmpresa" [(ngModel)]="empresaEditar.ruc" name="rucempresa" placeholder="Ej: 20123456789" />
      </div>

      <div class="flex flex-col gap-1">
        <label class="font-medium" for="razonSocial" >Razón Social</label>
        <input pInputText id="razonSocial" [(ngModel)]="empresaEditar.razonSocial" name="razonSocial" placeholder="Ej: EASY CLOUD"
           />
      </div>

       <p-divider />

       <h3 class="text-gray-400">Datos de contacto</h3>
      <div class="col-span-2 flex flex-col gap-1">
        <label class="font-medium" for="direccion">Dirección</label>
        <input pInputText id="direccion" name="direccion" [(ngModel)]="empresaEditar.direccion" name="longitudMin" />
      </div>

      <div class="col-span-2 flex flex-col gap-1">
        <label class="font-medium" for="razonSocial" >Teléfono</label>
        <input pInputText  [(ngModel)]="empresaEditar.telefono" name="telefono" />
      </div>

      <div class="col-span-2 flex flex-col gap-1">
        <label class="font-medium">Email</label>
        <input pInputText type="email" [(ngModel)]="empresaEditar.email" name="email" />
      </div>

       <div class="w-full flex flex-col">
          <label class="font-medium">Estado</label>
          <p-select [options]="estadosEmpresa" optionLabel="label" optionValue="value"
            [(ngModel)]="empresaEditar.estado" placeholder="Seleccione" appendTo="body">
          </p-select>
        </div>

    </div>

    <div class="col-span-2">
      <p-card class="relative overflow-hidden rounded-2xl shadow-md">
         <h3 class="text-gray-400 mb-2">Logo empresa</h3>
        <!-- Imagen preview -->
        <div class="relative">
          <img *ngIf="imageUrl; else placeholder" [src]="imageUrl" class="w-full h-64 object-cover rounded-xl" />

          <!-- Placeholder -->
          <ng-template #placeholder>
            <div class="w-full h-64 flex items-center justify-center bg-gray-100 rounded-xl">
              <i class="pi pi-image text-4xl text-gray-400"></i>
            </div>
          </ng-template>

          <!-- Botón eliminar -->
          <p-button *ngIf="imageUrl" pButton icon="pi pi-trash"
            class=" absolute top-2 right-2"
            (click)="removeImage()"></p-button>
        </div>

        <!-- Botón subir -->
        <div class="mt-3">
          <p-fileUpload mode="basic" name="file" accept="image/*" chooseLabel="Subir imagen" auto="true"
            customUpload="true" (uploadHandler)="onUpload($event)" class="w-full"></p-fileUpload>
        </div>

      </p-card>
    </div>
  </div>

  <ng-template #footer>
    <div class="flex justify-end gap-2">

       <p-button label="Cancelar" icon="pi pi-times" severity="secondary"
        [text]="true" (click)="volverLista()">
      </p-button>

      <p-button label="Guardar" icon="pi pi-check" severity="success"
        (click)="editar()">
      </p-button> -

    </div>
  </ng-template>

</p-dialog>

<p-toast />
